name: ECU Lab Android Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - "app/src/main/java/com/example/ui/eculab/**"
      - "app/src/main/java/com/example/ui/screens/EcuLabScreen.kt"
      - "app/src/main/java/com/example/ui/screens/ArsenalScreen.kt"
      - "app/src/main/java/com/example/ui/viewmodel/OverlordViewModel.kt"
      - "app/src/main/java/com/example/data/obd/ddt/DdtReadOnlyCommandPolicy.kt"
      - "app/src/test/java/com/example/data/obd/ddt/DdtReadOnlyCommandPolicyTest.kt"
      - "app/src/test/java/com/example/ui/eculab/**"
      - "app/src/test/java/com/example/ui/screens/EcuLabScreenTest.kt"
      - ".github/workflows/ecu-lab-android-tests.yml"

jobs:
  ecu-lab-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Java 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        shell: bash
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          test -x "${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null || true
          "${SDKMANAGER}"             "platform-tools"             "platforms;android-36.1"             "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: "9.3.1"

      - name: Compile ECU Lab UI
        run: gradle :app:compileDebugKotlin --no-daemon --stacktrace

      - name: Run ECU Lab model tests
        run: |
          gradle :app:testDebugUnitTest             --tests 'com.example.ui.eculab.EcuLabModelsTest'             --no-daemon             --stacktrace

      - name: Run Compose/Robolectric smoke test
        continue-on-error: true
        timeout-minutes: 5
        run: |
          gradle :app:testDebugUnitTest             --tests 'com.example.ui.screens.EcuLabScreenTest'             --no-daemon             --stacktrace
