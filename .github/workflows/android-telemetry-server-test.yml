name: Android telemetry server tests

on:
  pull_request:
    paths:
      - 'tools/android-telemetry-server/**'
      - '.github/workflows/android-telemetry-server-test.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/android-telemetry-server/**'
      - '.github/workflows/android-telemetry-server-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/android-telemetry-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile Python
        run: python -m py_compile server.py test_server.py
      - name: Unit tests
        run: python -m unittest -v test_server.py
